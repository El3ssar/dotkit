name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: python3 tests/run.py
      - run: python3 tests/remote.py
      - run: for suite in tests/adversarial_*.py; do python3 "$suite"; done

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked

  provisioning:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - if: runner.os == 'Linux'
        run: shellcheck -S warning -s bash install.sh assets/remote/*.sh assets/remote/kit-env assets/remote/kit-shell
      - run: python3 tests/live.py --kit target/debug/kit
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - run: python3 tests/fizsh.py

  ssh-provisioning:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: docker build -t dotkit-ssh-test -f tests/containers/ssh.Dockerfile tests/containers
      - run: docker run --rm -e KIT_SSH_TEST_CONTAINER=1 -v "$PWD:/work:ro" dotkit-ssh-test python3 tests/ssh_live.py --kit target/debug/kit
