[package]
name = "dotkit"
version = "0.3.0-dev"
edition = "2021"
rust-version = "1.88"
description = "Your dotfiles and tools, the same on every machine: track them in git, sync and merge between machines, and put your shell on servers over ssh"
license = "MIT"
repository = "https://github.com/El3ssar/dotkit"
homepage = "https://github.com/El3ssar/dotkit"
readme = "README.md"
keywords = ["dotfiles", "sync", "config", "ssh", "cli"]
categories = ["command-line-utilities", "config"]
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "kit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["string", "wrap_help"] }
serde_json = "1"
sha2 = "0.11.1"
sha1 = "0.11.0"
hex = "0.4"
regex = "1"
similar = "3.2.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29", "underline-color", "layout-cache"] }
crossterm = "0.29.0"
semver = "1"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
