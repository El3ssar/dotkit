[package]
name = "dotkit"
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
description = "Your dotfiles and tools, the same on every machine: track them in git, sync and merge between machines, and put your shell on servers over ssh"
license = "MIT"
repository = "https://github.com/El3ssar/dotkit"
homepage = "https://github.com/El3ssar/dotkit"
readme = "README.md"
keywords = ["dotfiles", "sync", "config", "ssh", "cli"]
categories = ["command-line-utilities", "config"]
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "kit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["string", "wrap_help"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
regex = "1"
similar = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
